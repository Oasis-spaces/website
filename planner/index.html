<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room planner — Oasis-spaces</title>
<meta name="description" content="Drag furniture around a to-scale floor plan. A Python backend checks collisions, door swing and walkability, estimates paint and flooring, and can arrange the room for you.">
<meta name="theme-color" content="#F1F2ED">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="planner.css">
</head>
<body>
<a class="skip" href="#main">Skip to the planner</a>
<header class="pl-top wrap">
  <a href="../" class="pl-brand"><img src="../logo-mark.png" alt="" width="36" height="36"><span>Oasis-spaces</span></a>
  <p class="eyebrow" id="conn">Python backend: checking…</p>
</header>

<main id="main" class="wrap pl">
  <div class="pl-head">
    <p class="eyebrow">Room planner</p>
    <h1 class="display-2">Plan it to scale. <em>Python checks the maths.</em></h1>
  </div>

  <div class="pl-grid">
    <section class="pl-stage" aria-label="Floor plan">
      <div class="pl-bar">
        <label>Preset
          <select id="preset"></select>
        </label>
        <button class="btn btn--ghost btn--sm" id="arrange">Auto-arrange</button>
        <button class="btn btn--ghost btn--sm" id="undo" disabled>Undo</button>
        <button class="btn btn--ghost btn--sm" id="rotate" disabled>Rotate (R)</button>
        <button class="btn btn--ghost btn--sm" id="share">Copy share link</button>
        <button class="btn btn--ghost btn--sm" id="export">Export CSV</button>
      </div>
      <canvas id="plan" tabindex="0" aria-label="Floor plan. Drag furniture; arrow keys nudge the selected piece, R rotates it."></canvas>
      <p class="pl-hint" id="hint">Drag a piece. Arrow keys nudge it by 10 cm, R rotates it.</p>
    </section>

    <aside class="pl-side">
      <form id="room" class="pl-card" autocomplete="off">
        <h2>Room</h2>
        <div class="pl-fields">
          <label>Width (m)<input name="width" type="number" step="0.1" min="1.5" max="15"></label>
          <label>Length (m)<input name="length" type="number" step="0.1" min="1.5" max="15"></label>
          <label>Height (m)<input name="height" type="number" step="0.1" min="2" max="4.5"></label>
          <label>Coats of paint<input name="coats" type="number" step="1" min="1" max="4" value="2"></label>
        </div>
      </form>

      <div class="pl-card" id="results" aria-live="polite">
        <h2>Result</h2>
        <div class="pl-score"><b id="score">–</b><span>layout score</span></div>
        <dl id="metrics"></dl>
        <ul id="issues"></ul>
      </div>

      <form id="add" class="pl-card" autocomplete="off">
        <h2>Add furniture</h2>
        <div class="pl-fields">
          <label>Name<input name="name" value="Armchair" maxlength="40"></label>
          <label>W (m)<input name="w" type="number" step="0.05" min="0.1" max="6" value="0.8"></label>
          <label>D (m)<input name="d" type="number" step="0.05" min="0.1" max="6" value="0.8"></label>
        </div>
        <button class="btn btn--ink btn--sm" type="submit">Add</button>
        <button class="btn btn--ghost btn--sm" type="button" id="remove" disabled>Remove selected</button>
      </form>
    </aside>
  </div>
</main>
<script src="planner.js"></script>
</body>
</html>
